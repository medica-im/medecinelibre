# dev.medecinelibre.com -> vite dev server on the dev VPS.
#
# Install:
#   sudo cp scripts/nginx/dev.medecinelibre.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/dev.medecinelibre.com.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d dev.medecinelibre.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# certbot adds the ssl_certificate lines and the :80 -> :443 redirect.
# Leave server_name and the .well-known location alone: the installer
# finds this block by server_name, and the ACME http-01 challenge is
# served from here.

upstream vite_dev_medecinelibre {
    server 127.0.0.1:5173;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.medecinelibre.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://vite_dev_medecinelibre;
        proxy_http_version 1.1;

        # Vite's HMR runs over a websocket. Without these two headers the
        # page loads but never live-reloads — which is the entire reason
        # this host exists, and it fails silently.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A dev server recompiles on request; the default 60s read timeout
        # can fire on a cold first load of a large route.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }
}
