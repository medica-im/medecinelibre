# staging.medecinelibre.com -> the built container on the staging VPS.
#
# Install:
#   sudo cp scripts/nginx/staging.medecinelibre.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/staging.medecinelibre.com.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d staging.medecinelibre.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Port 3105: 3101-3104 are taken by the other staging sites on this box.

server {
    listen 80;
    listen [::]:80;
    server_name staging.medecinelibre.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staging must never be indexed: it serves the same content as the
    # real site, and a crawled copy competes with it.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
